<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro - Fatura & Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Cabeçalho -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-600">Controle Financeiro Inteligente</h1>
            <p class="text-slate-500 mt-1">Gestão de Fatura Fechada, Contas Fixas e Raio-X sem Duplicidade</p>
        </header>

        <!-- Painel de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase">Total Entradas</span>
                <h2 id="resumoEntradas" class="text-2xl font-bold text-emerald-600 mt-1">R$ 0,00</h2>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase">Total Saídas (Com Fatura Fechada)</span>
                <h2 id="resumoSaidas" class="text-2xl font-bold text-rose-600 mt-1">R$ 0,00</h2>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase">Saldo Livre do Mês</span>
                <h2 id="resumoSaldo" class="text-2xl font-bold text-blue-600 mt-1">R$ 0,00</h2>
            </div>
        </div>

        <!-- Seção de Importação / Lançamento Rápido -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
            <h3 class="text-lg font-bold text-slate-700 mb-4">Adicionar Lançamento ou Fatura</h3>
            
            <form id="transacaoForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Mês/Ano</label>
                    <input type="text" id="mesAno" value="11/26" class="w-full p-2 border rounded-lg text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Tipo</label>
                    <select id="tipo" class="w-full p-2 border rounded-lg text-sm">
                        <option value="saída">Saída / Fatura</option>
                        <option value="entrada">Entrada</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex: Fatura Bradesco / Salário" class="w-full p-2 border rounded-lg text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" placeholder="0.00" class="w-full p-2 border rounded-lg text-sm" required>
                </div>
                <div class="md:col-span-4 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg text-sm transition">
                        Adicionar ao Caixa
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabela de Lançamentos -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-700">Lançamentos do Mês</h3>
                <button onclick="carregarDadosIniciais()" class="text-xs text-blue-600 hover:underline">Carregar Exemplo Base</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-xs uppercase border-b">
                            <th class="p-3">Mês</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Descrição</th>
                            <th class="p-3">Valor</th>
                            <th class="p-3 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                        <!-- Dados injetados por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let transacoes = JSON.parse(localStorage.getItem('minhas_financas')) || [
            { id: 1, mes: '11/26', tipo: 'entrada', descricao: 'Salário Cris', valor: 3150.00 },
            { id: 2, mes: '11/26', tipo: 'entrada', descricao: 'Salário Francisco', valor: 3200.00 },
            { id: 3, mes: '11/26', tipo: 'entrada', descricao: 'Aposentadoria Pai', valor: 1600.00 },
            { id: 4, mes: '11/26', tipo: 'saída', descricao: 'Luz & Água', valor: 720.00 },
            { id: 5, mes: '11/26', tipo: 'saída', descricao: 'Empréstimos', valor: 1504.97 },
            { id: 6, mes: '11/26', tipo: 'saída', descricao: 'Fatura Fechada Bradesco', valor: 8570.05 }
        ];

        function atualizarApp() {
            const corpo = document.getElementById('tabelaCorpo');
            corpo.innerHTML = '';
            
            let totalEntradas = 0;
            let totalSaidas = 0;

            transacoes.forEach((t, index) => {
                if (t.tipo === 'entrada') totalEntradas += t.valor;
                if (t.tipo === 'saída') totalSaidas += t.valor;

                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-50 hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3">${t.mes}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold ${t.tipo === 'entrada' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${t.tipo}</span></td>
                    <td class="p-3 font-medium text-slate-700">${t.descricao}</td>
                    <td class="p-3 font-semibold ${t.tipo === 'entrada' ? 'text-emerald-600' : 'text-slate-700'}">R$ ${t.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td class="p-3 text-right">
                        <button onclick="remover(${index})" class="text-slate-400 hover:text-rose-600 text-xs">Excluir</button>
                    </td>
                `;
                corpo.appendChild(tr);
            });

            document.getElementById('resumoEntradas').innerText = `R$ ${totalEntradas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('resumoSaidas').innerText = `R$ ${totalSaidas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            
            const saldo = totalEntradas - totalSaidas;
            const elSaldo = document.getElementById('resumoSaldo');
            elSaldo.innerText = `R$ ${saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            elSaldo.className = `text-2xl font-bold mt-1 ${saldo >= 0 ? 'text-blue-600' : 'text-rose-600'}`;

            localStorage.setItem('minhas_financas', JSON.stringify(transacoes));
        }

        document.getElementById('transacaoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nova = {
                id: Date.now(),
                mes: document.getElementById('mesAno').value,
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value)
            };
            transacoes.push(nova);
            atualizarApp();
            this.reset();
            document.getElementById('mesAno').value = '11/26';
        });

        function remover(index) {
            transacoes.splice(index, 1);
            atualizarApp();
        }

        function carregarDadosIniciais() {
            localStorage.removeItem('minhas_financas');
            location.reload();
        }

        atualizarApp();
    </script>
</body>
</html>
